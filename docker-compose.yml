version: '3.8'

name: najnaj-web-app

services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: najnaj-flask-container
    ports:
      - "5000:5000"
    env_file:
      - env.flask
    volumes:
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - najnaj-network

  tailwind-css:
    build:
      context: .
      dockerfile: Dockerfile.tailwind
    container_name: najnaj-tailwind-container
    ports:
      - "3000:3000"
    env_file:
      - env.tailwind
    volumes:
      - ./static/css:/app/static/css
      - ./tailwind.config.js:/app/tailwind.config.js:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "npm", "run", "build"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - najnaj-network
    depends_on:
      - flask-app

networks:
  najnaj-network:
    driver: bridge 

volumes:
  flask-data:
  